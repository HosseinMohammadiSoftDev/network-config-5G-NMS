<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Dynamic Form with Tabs and Auto-Save</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .section-title {
        font-size: 1.1em;
        font-weight: bold;
        color: #333;
        margin-top: 15px;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .form-row {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .form-row label {
        font-weight: bold;
        width: 150px;
        margin-right: 10px;
      }
      .form-row input[type="text"],
      .form-row select {
        padding: 8px;
        flex: 1;
        min-width: 180px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-top: 5px;
      }
      .nested-container {
        margin-left: 20px;
        padding-left: 10px;
        border-left: 2px solid #ddd;
        margin-top: 10px;
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container my-5">
      <ul
        class="nav nav-tabs"
        id="mainTabs"
        role="tablist"
      ></ul>
      <div
        class="tab-content"
        id="tabContent"
      ></div>
    </div>

    <script>
      let debounceTimers = {};

      function generateFormFromJson(data) {
        const mainTabs = document.getElementById("mainTabs");
        const tabContent = document.getElementById("tabContent");

        Object.keys(data).forEach((key, index) => {
          const tabId = `tab-${key}`;
          const tabButton = document.createElement("li");
          tabButton.classList.add("nav-item");
          tabButton.innerHTML = `
            <button class="nav-link ${
              index === 0 ? "active" : ""
            }" id="${tabId}-tab" data-bs-toggle="tab" data-bs-target="#${tabId}" type="button" role="tab" aria-controls="${tabId}" aria-selected="${
            index === 0
          }">
              ${key}
            </button>
          `;
          mainTabs.appendChild(tabButton);

          const tabPane = document.createElement("div");
          tabPane.classList.add(
            "tab-pane",
            "fade",
            index === 0 ? "show" : "null"
          );
          tabPane.classList.add(index === 0 ? "active" : "null");
          tabPane.id = tabId;
          tabPane.setAttribute("role", "tabpanel");
          tabPane.setAttribute("aria-labelledby", `${tabId}-tab`);

          const form = document.createElement("form");
          createInputs(key, data[key], form, key);
          tabPane.appendChild(form);

          tabContent.appendChild(tabPane);
        });
      }

      function createInputs(key, value, container, path) {
        if (typeof value === "string" || typeof value === "number") {
          const formRow = document.createElement("div");
          formRow.classList.add("form-row");

          const label = document.createElement("label");
          label.textContent = key;
          formRow.appendChild(label);

          const input = document.createElement("input");
          input.type = "text";
          input.value = value;
          input.classList.add("form-control");
          input.setAttribute("data-path", path);
          input.addEventListener("input", handleInputChange);
          formRow.appendChild(input);

          container.appendChild(formRow);
        } else if (typeof value === "boolean") {
          const formRow = document.createElement("div");
          formRow.classList.add("form-row");

          const label = document.createElement("label");
          label.textContent = key;
          formRow.appendChild(label);

          const select = document.createElement("select");
          select.classList.add("form-control");
          select.setAttribute("data-path", path);
          select.addEventListener("change", handleInputChange);

          const trueOption = document.createElement("option");
          trueOption.value = "true";
          trueOption.textContent = "true";
          trueOption.selected = value === true;

          const falseOption = document.createElement("option");
          falseOption.value = "false";
          falseOption.textContent = "false";
          falseOption.selected = value === false;

          select.appendChild(trueOption);
          select.appendChild(falseOption);
          formRow.appendChild(select);

          container.appendChild(formRow);
        } else if (Array.isArray(value)) {
          const sectionTitle = document.createElement("div");
          sectionTitle.classList.add("section-title");
          sectionTitle.textContent = `${key}`;
          container.appendChild(sectionTitle);

          const nestedContainer = document.createElement("div");
          nestedContainer.classList.add("nested-container");

          value.forEach((item, index) => {
            createInputs(
              `${key}[${index}]`,
              item,
              nestedContainer,
              `${path}[${index}]`
            );
          });

          container.appendChild(nestedContainer);
        } else if (typeof value === "object" && value !== null) {
          const sectionTitle = document.createElement("div");
          sectionTitle.classList.add("section-title");
          sectionTitle.textContent = `${key}`;
          container.appendChild(sectionTitle);

          const nestedContainer = document.createElement("div");
          nestedContainer.classList.add("nested-container");

          for (const [nestedKey, nestedValue] of Object.entries(value)) {
            createInputs(
              nestedKey,
              nestedValue,
              nestedContainer,
              `${path}.${nestedKey}`
            );
          }

          container.appendChild(nestedContainer);
        }
      }

      function handleInputChange(event) {
        const input = event.target;
        const path = input.getAttribute("data-path");
        const newValue =
          input.tagName === "SELECT" ? input.value === "true" : input.value;

        clearTimeout(debounceTimers[path]);

        debounceTimers[path] = setTimeout(() => {
          saveDataToServer(path, newValue);
        }, 2000);
      }

      function saveDataToServer(path, value) {
        // console.log(path, value);
        // fetch("/save", {
        //   method: "POST",
        //   headers: {
        //     "Content-Type": "application/json",
        //   },
        //   body: JSON.stringify({ path, value }),
        // })
        //   .then((response) => response.json())
        //   .then((data) => // console.log("Data saved successfully:", data))
        //   .catch((error) => console.error("Error saving data:", error));
      }

      // Example JSON data with boolean values
      const jsonData = {
        logger: { file: "logfile.log", level: "info", debug: true },
        mme: {
          freeDiameter: "sysconfdir@/freeDiameter/m",
          s1ap: [
            { dev: 120, enabled: false },
            {
              addr: "127.0.0.7",
              port: 36413,
              option: { secure: true, retries: 3 },
            },
          ],
        },
        gtp: { addr: "127.0.0.7", secureConnection: false },
        metrics: { addr: "127.0.0.7", port: 9090 },
        gummei: { plmn_id: { mcc: 77, mnc: 555 }, mme_gid: 55, mme_code: 55 },
        tai: { plmn_id: { mcc: 999, mnc: 70 }, tac: [1, 2] },
        security: {
          ciphering_order: "EEA0",
          encryption: ["EEA1", "EEA2"],
          enableEncryption: true,
        },
      };

      generateFormFromJson(jsonData);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

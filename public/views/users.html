<!DOCTYPE html>
<html
  lang="fa"
  dir="rtl"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Users</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" crossorigin href="/assets/users-D0XGdk6R.css">
  </head>
  <body>
    <div
      class="modal fade"
      id="staticBackdrop"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      tabindex="-1"
      aria-labelledby="staticBackdropLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body">
            <div id="divEditServer">
              <div
                class="container-fluid formEdit d-flex justify-content-center align-items-center"
              >
                <form class="w-100 was-validated">
                  <div class="mb-3">
                    <label
                      for="exampleInputEmail1"
                      class="form-label"
                      >نام</label
                    >
                    <input
                      minlength="3"
                      for="validationText"
                      class="form-control"
                      id="nameInput"
                      type="text"
                      name="myInputServer"
                      aria-label="default input example"
                    />
                  </div>
                  <div class="mb-3">
                    <label
                      for="exampleInputPassword1"
                      class="form-label"
                      >نام خانوادگی
                    </label>
                    <input
                      class="form-control"
                      id="familyInput"
                      type="text"
                      name="myInputIP"
                      aria-label="default input example"
                    />
                  </div>
                  <div class="mb-3">
                    <label
                      for="exampleInputPassword1"
                      class="form-label"
                      >سطح دسترسی
                    </label>
                    <select
                      class="form-select"
                      id="select"
                      aria-label="Default select example"
                    >
                      <option
                        selected
                        value="admin"
                      >
                        admin
                      </option>
                      <option value="operator">operator</option>
                      <option value="visitor">visitor</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label
                      for="exampleInputPassword1"
                      class="form-label"
                      >رمز عبور
                    </label>
                    <input
                      class="form-control"
                      id="password"
                      type="password"
                      name="myInputIP"
                      aria-label="default input example"
                    />
                  </div>
                  <div class="mb-3">
                    <label
                      for="exampleInputPassword1"
                      class="form-label"
                      >تکرار رمز عبور
                    </label>
                    <input
                      class="form-control"
                      id="repeatPassword"
                      type="password"
                      name="myInputIP"
                      aria-label="default input example"
                    />
                  </div>
                  <div class="mb-3">
                    <input
                      type="checkbox"
                      onclick="showPassword()"
                      class="form-check-input"
                      id="exampleCheck1"
                    />
                    <label
                      class="form-check-label"
                      for="exampleCheck1"
                      >نمایش رمز عبور</label
                    >
                  </div>
                  <button
                    type="button"
                    onclick="Sub()"
                    class="btn btn-primary"
                  >
                    ثبت
                  </button>
                  <button
                    type="button"
                    class="btn btn-danger"
                    data-bs-dismiss="modal"
                  >
                    لغو
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <table class="table table-striped text-center">
      <thead>
        <tr>
          <th scope="col">نام</th>
          <th scope="col">نام خانوادگی</th>
          <th scope="col">سطح دسترسی</th>
          <th scope="col">ویرایش</th>
          <th scope="col">حذف</th>
        </tr>
      </thead>
      <tbody id="tBody">
        <tr>
          <td>علی</td>
          <td>امینی</td>
          <td>admin</td>
          <td>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="26"
              height="26"
              fill="currentColor"
              class="bi bi-pencil-square"
              viewBox="0 0 16 16"
              onclick="editUser()"
            >
              <path
                d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"
              />
              <path
                fill-rule="evenodd"
                d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"
              />
            </svg>
          </td>
          <td>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="30"
              height="30"
              fill="currentColor"
              class="bi bi-person-x"
              viewBox="0 0 16 16"
            >
              <path
                d="M11 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0M8 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4m.256 7a4.5 4.5 0 0 1-.229-1.004H3c.001-.246.154-.986.832-1.664C4.484 10.68 5.711 10 8 10q.39 0 .74.025c.226-.341.496-.65.804-.918Q8.844 9.002 8 9c-5 0-6 3-6 4s1 1 1 1z"
              />
              <path
                d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7m-.646-4.854.646.647.646-.647a.5.5 0 0 1 .708.708l-.647.646.647.646a.5.5 0 0 1-.708.708l-.646-.647-.646.647a.5.5 0 0 1-.708-.708l.647-.646-.647-.646a.5.5 0 0 1 .708-.708"
              />
            </svg>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="me-3">
      <button
        type="button"
        class="btn btn-primary"
        data-bs-toggle="modal"
        data-bs-target="#staticBackdrop"
      >
        اضافه کاربر
      </button>
      <a href="../views/dashboard.html">
        <button
          type="button"
          class="btn btn-primary me-2"
        >
          بازگشت
        </button>
      </a>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../assets/scripts/Users.js"></script>
  </body>
</html>
